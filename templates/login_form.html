<form method="post" action="{{ url_for('login') }}" class="card-body login-form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="login-username">Username<input id="login-username" name="username" autocomplete="username" required></label>
  <label for="login-password">Password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
  <button class="button full" type="submit">Log in</button>
</form>
